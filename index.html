<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Птушыны слоўнік</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4c81af;
            padding: 15px;
            color: white;
        }

        .donate-button {
            background-color: #FFD700;
            color: black;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .donate-button:hover {
            background-color: #FFC107;
        }

        #cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1f2937;
            color: white;
            padding: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
        }

        #cookie-banner button {
            margin-left: 10px;
            padding: 8px 14px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .accept-btn {
            background-color: #10b981;
            color: white;
        }

        .decline-btn {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Птушыны слоўнік</h1>
    <a class="donate-button"
       href="https://www.paypal.com/donate/?hosted_button_id=2HCCJZRW76PVY"
       target="_blank">
        Падтрымаць праект
    </a>
</header>

<h2>Усе птушкі Еўропы:</h2>

<input type="text" id="search-input" placeholder="Пошук па назве...">
<button onclick="searchBirds()">🔍 Пошук</button>

<div id="all-birds"></div>

<script src="data.js"></script>
<script src="ebird.js"></script>
<script src="ebird_pt_pt.js"></script>
<script src="ebird_pl.js"></script>

<script>
function getEnglishName(latinName) {
    const birdMatch = ebirdsData.find(bird => bird.sciName === latinName);
    return birdMatch ? birdMatch.comName : "Няма дадзеных";
}

function getPolishName(latinName) {
    const birdMatch = ebirdsDataPl.find(bird => bird.sciName === latinName);
    return birdMatch ? birdMatch.comName : "Няма дадзеных";
}

function getPortugueseName(latinName) {
    const birdMatch = ebirdsDataPt.find(bird => bird.sciName === latinName);
    return birdMatch ? birdMatch.comName : "Няма дадзеных";
}

function displayBirds(filteredBirds) {
    const allBirdsDiv = document.getElementById('all-birds');
    allBirdsDiv.innerHTML = '';

    if (filteredBirds.length === 0) {
        allBirdsDiv.innerHTML = "<p>Нічога не знойдзена</p>";
        return;
    }

    filteredBirds.forEach(bird => {
        const englishName = getEnglishName(bird["Лацінская назва"]);
        const polishName = getPolishName(bird["Лацінская назва"]);
        const portugueseName = getPortugueseName(bird["Лацінская назва"]);

        const birdDiv = document.createElement('div');
        birdDiv.innerHTML = `
            <p><strong>Лацінская назва:</strong> ${bird["Лацінская назва"]}</p>
            <p><strong>Беларуская назва:</strong> ${bird["Беларуская назва"]}</p>
            <p><strong>Англійская назва:</strong> ${englishName}</p>
            <p><strong>Партугальская назва:</strong> ${portugueseName}</p>
            <p><strong>Польская назва:</strong> ${polishName}</p>
            <p><strong>Руская назва:</strong> ${bird["Руская назва"]}</p>
            <hr>
        `;
        allBirdsDiv.appendChild(birdDiv);
    });
}

function searchBirds() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();

    if (query === "") {
        displayBirds(birdsData);
        return;
    }

    const filteredBirds = birdsData.filter(bird =>
        bird["Беларуская назва"].toLowerCase().includes(query) ||
        bird["Руская назва"].toLowerCase().includes(query) ||
        bird["Лацінская назва"].toLowerCase().includes(query) ||
        getEnglishName(bird["Лацінская назва"]).toLowerCase().includes(query) ||
        getPolishName(bird["Лацінская назва"]).toLowerCase().includes(query) ||
        getPortugueseName(bird["Лацінская назва"]).toLowerCase().includes(query)
    );

    displayBirds(filteredBirds);

    if (typeof gtag === "function") {
        gtag('event', 'search', {
            'event_label': query
        });
    }
}

displayBirds(birdsData);

document.getElementById('search-input').addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        searchBirds();
    }
});
</script>

<!-- ================= COOKIE + GOOGLE ANALYTICS ================= -->

<div id="cookie-banner">
    <div>
        We use cookies to collect anonymous statistics (Google Analytics).
    </div>
    <div>
        <button class="accept-btn" onclick="acceptCookies()">Accept</button>
        <button class="decline-btn" onclick="declineCookies()">Decline</button>
    </div>
</div>

<script>
function loadGoogleAnalytics() {
    var script = document.createElement("script");
    script.async = true;
    script.src = "https://www.googletagmanager.com/gtag/js?id=G-9BHYMS09HX";
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;

    gtag('js', new Date());
    gtag('config', 'G-9BHYMS09HX');
}

function acceptCookies() {
    localStorage.setItem("cookie_consent", "accepted");
    document.getElementById("cookie-banner").style.display = "none";
    loadGoogleAnalytics();
}

function declineCookies() {
    localStorage.setItem("cookie_consent", "declined");
    document.getElementById("cookie-banner").style.display = "none";
}

window.onload = function() {
    var consent = localStorage.getItem("cookie_consent");

    if (consent === "accepted") {
        loadGoogleAnalytics();
    } else if (!consent) {
        document.getElementById("cookie-banner").style.display = "flex";
    }
};
</script>

</body>
</html>
