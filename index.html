<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Птушыны слоўнік</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                margin-left: 20px;
                margin-right: 20px;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #4CAF50;
                padding: 15px;
                color: white;
            }
            .donate-button {
                background-color: #FFD700;
                color: black;
                padding: 10px 15px;
                text-decoration: none;
                border-radius: 5px;
                font-weight: bold;
            }
            .donate-button:hover {
                background-color: #FFC107;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Птушыны слоўнік</h1>
            <a class="donate-button" href="https://www.paypal.com/donate/?hosted_button_id=2HCCJZRW76PVY" target="_blank">Падтрымаць праект</a>
        </header>

<body>
    <h1></h1>

    <!-- Поле поиска -->
    <input type="text" id="search-input" placeholder="Пошук па назве...">
    <button onclick="searchBirds()">🔍 Пошук</button>
    
    <h2>Усе птушкі Еўропы:</h2>
    <div id="all-birds"></div> <!-- Здесь будут отображаться птицы -->

    <script src="data.js"></script>
    <script src="ebird.js"></script>
    <script src="ebird_pt_pt.js"></script>
    <script src="ebird_pl.js"></script>
    <script>
        function getEnglishName(latinName) {
            const birdMatch = ebirdsData.find(bird => bird.sciName === latinName);
            return birdMatch ? birdMatch.comName : "Няма дадзеных";
        }
    
        function getPolishName(latinName) {
            const birdMatch = ebirdsDataPl.find(bird => bird.sciName === latinName);
            return birdMatch ? birdMatch.comName : "Няма дадзеных";
        }

        function getPortugueseName(latinName) {
            const birdMatch = ebirdsDataPt.find(bird => bird.sciName === latinName);
            return birdMatch ? birdMatch.comName : "Няма дадзеных";
        }
    
        function displayBirds(filteredBirds) {
            const allBirdsDiv = document.getElementById('all-birds');
            allBirdsDiv.innerHTML = '';
    
            if (filteredBirds.length === 0) {
                allBirdsDiv.innerHTML = "<p>Нічога не знойдзена</p>";
                return;
            }
    
            filteredBirds.forEach(bird => {
                const englishName = getEnglishName(bird["Лацінская назва"]);
                const polishName = getPolishName(bird["Лацінская назва"]);
                const portugueseName = getPolishName(bird["Лацінская назва"]);

    
                const birdDiv = document.createElement('div');
                birdDiv.innerHTML = `
                    <p><strong>Лацінская назва:</strong> ${bird["Лацінская назва"]}</p>
                    <p><strong>Беларуская назва:</strong> ${bird["Беларуская назва"]}</p>
                    <p><strong>Руская назва:</strong> ${bird["Руская назва"]}</p>
                    <p><strong>Англійская назва:</strong> ${englishName}</p>
                    <p><strong>Польская назва:</strong> ${polishName}</p>
                    <p><strong>Партугальская назва:</strong> ${portugueseName}</p>
                    <hr>
                `;
                allBirdsDiv.appendChild(birdDiv);
            });
        }
    
        function searchBirds() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
    
            if (query === "") {
                displayBirds(birdsData);
                return;
            }
    
            const filteredBirds = birdsData.filter(bird =>
                bird["Беларуская назва"].toLowerCase().includes(query) ||
                bird["Руская назва"].toLowerCase().includes(query) ||
                bird["Лацінская назва"].toLowerCase().includes(query) ||
                getEnglishName(bird["Лацінская назва"]).toLowerCase().includes(query) ||
                getPolishName(bird["Лацінская назва"]).toLowerCase().includes(query) ||
                getPortugueseName(bird["Лацінская назва"]).toLowerCase().includes(query)
            );
    
            displayBirds(filteredBirds);
        }
    
        displayBirds(birdsData);
    
        document.getElementById('search-input').addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                searchBirds();
            }
        });
    </script>
    
</body>
</html>
